name: Build Windows exe

on:
  # 手動実行
  workflow_dispatch:
  # v* タグを push したときにビルドしてリリースへ添付
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# リリース作成のために必要
permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri build がフロントエンド(pnpm build)と Rust 本体をビルドし、
      # 実行ファイル(tablex.exe)と NSIS/MSI インストーラを生成する
      - name: Build Tauri app
        run: pnpm tauri build

      # 生成物を Actions のアーティファクトとしてアップロード
      - name: Upload standalone exe
        uses: actions/upload-artifact@v4
        with:
          name: tablex-windows-exe
          path: src-tauri/target/release/tablex.exe
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tablex-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # タグ push のときは GitHub Release に成果物を添付
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/tablex.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
